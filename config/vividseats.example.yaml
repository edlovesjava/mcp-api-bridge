# Two-service catalog config, showing how opaque ids are handled.
#
# Scaffolded with `mcp-api-bridge import-openapi` from the two specs in this
# repo, then hand-edited for the parts OpenAPI cannot express — the sort
# descriptions, the response field roles, and the `lookup`/`resolve` blocks
# that turn id-keyed filters into ones a person (or a model) can actually fill.
#
# The two services split by role:
#   catalog-service         direct data. Authoritative reads, and the reference
#                           tables (/v1/regions, /v1/categories) that back the
#                           closed-set lookups below.
#   catalog-search-service  Algolia-backed text search. Good at "which performer
#                           did they mean", which is what `resolve` needs.

version: 1

defaults:
  timeout_seconds: 20
  max_retries: 2
  page_size: 25

bedrock:
  region: us-east-1
  model_id: anthropic.claude-opus-5
  effort: low
  guidance: |
    This is a live-events catalog, not retail. A "production" is a single
    event: one performer (or matchup) at one venue on one date. A "performer"
    is an artist, team, or touring show. Users say "tickets for X" or "X in
    <city>" far more often than they name a category.

apis:
  # ---------------------------------------------------------------------
  # Events. Filters keyed by opaque ids accept names instead — see the
  # `lookup:` and `resolve:` blocks.
  # ---------------------------------------------------------------------
  - name: productions
    description: >-
      Live events — a performer or matchup at a venue on a date. Does not
      return past events.
    base_url: http://catalog-service.corp.int.vividseats-staging.com/api
    auth:
      type: none # the spec declares no securitySchemes; confirm what fronts this

    search:
      method: GET
      path: /v1/productions
      query:
        query: "{query}"
        page: "{page}"
        pageSize: "{page_size}"
        sortBy: "{sort}"
      first_page: 1

      filters:
        # --- closed sets: table fetched once, names published as vocabulary ---
        region:
          param: regionId
          type: integer
          description: >-
            Metro area the event's venue sits in. Use for "in Chicago",
            "near Boston". Prefer this over `city` for metro-wide searches.
          lookup:
            path: /v1/regions
            items_path: items
            id_field: id
            name_field: name
            # Regions carry a second display name; accept either spelling.
            alias_fields: [listName]
            params:
              pageSize: 500

        category:
          param: categoryId
          type: integer
          description: Broad event type — concerts, sports, theater.
          lookup:
            path: /v1/categories
            items_path: items
            id_field: id
            name_field: name

        # --- open sets: resolved live against a text-search catalog ---
        performer:
          param: performerId
          type: integer
          description: >-
            Artist, team, or touring show. Give the name exactly as the user
            said it — "Taylor Swift", "Chicago Bears".
          resolve:
            api: performers

        venue:
          param: venueId
          type: integer
          description: Venue name, e.g. "Wrigley Field".
          resolve:
            api: venues

        # --- ordinary value filters, imported from the spec ---
        startDate:
          param: startDate
          type: string
          description: "Only events on or after this day. Format: yyyy-MM-dd"
        endDate:
          param: endDate
          type: string
          description: "Only events on or before this day. Format: yyyy-MM-dd"
        city:
          param: city
          type: string
          description: Exact city name of the venue. Narrower than `region`.
        stateCode:
          param: stateCode
          type: string
          description: Two-letter state code of the venue.
        months:
          param: months
          type: integer
          style: repeat
          description: One or more month numbers (1-12) to restrict to.
        price_min:
          param: minListingPriceFloor
          type: integer
          description: Only events whose cheapest listing is at or above this price.
        price_max:
          param: minListingPriceCeiling
          type: integer
          description: Only events whose cheapest listing is at or below this price.
        excludeParking:
          param: excludeParking
          type: boolean
          description: Drop parking-pass listings, which are rarely what a user wants.

      sorts:
        - name: date
          value: DATE
          description: Soonest first. The sensible default for "when is X playing".
        - name: rank
          value: RANK
          description: Popularity. Use for "best", "biggest", "most popular".
        - name: name
          value: NAME
          description: Alphabetical by event name.
        - name: rankdate
          value: RANKDATE
          description: Popularity weighted by proximity in time.

      response:
        items_path: items
        total_path: total
        fields:
          id: id
          title: name
          url: organicUrl
          image: staticMapUrl
        attributes:
          date: localDate
          venue: venue.name
          city: venue.city
          state: venue.state
          min_price: minPrice
          max_price: maxPrice
          listing_count: listingCount

    # The direct-data service has a real by-id read, which the search service
    # lacks — so productions get a proper get_item.
    get_item:
      method: GET
      path: /v1/productions/{id}
      response:
        fields:
          id: id
          title: name
          url: organicUrl
        attributes:
          date: localDate
          venue: venue.name
          min_price: minPrice
          listing_count: listingCount

  # ---------------------------------------------------------------------
  # Text search over performers. Also the resolver behind
  # `productions.performer` — Algolia handles misspellings and partial names,
  # which is exactly what name resolution needs.
  # ---------------------------------------------------------------------
  - name: performers
    description: Artists, teams, and touring shows. Text search over the performer index.
    base_url: https://catalog-search-service.corp.int.vividseats-staging.com
    auth:
      type: none

    search:
      method: GET
      path: /api/v1/performers
      query:
        query: "{query}"
        page: "{page}"
        pageSize: "{page_size}"
        sortBy: "{sort}"
      first_page: 1
      filters:
        activeFilter:
          param: activeFilter
          type: string
          values: [ALL, ACTIVE_ONLY, INACTIVE_ONLY]
          description: Whether to include performers with no upcoming events.
        minProductionCount:
          param: minProductionCount
          type: integer
          description: Only performers with at least this many upcoming events.
      sorts:
        - name: relevance
          value: NONE
          description: Best text match. The default.
        - name: rank
          value: RANK
          description: Popularity first.
      response:
        items_path: items
        total_path: total
        fields:
          id: id
          title: name
          url: organicUrl
        attributes:
          category: category.name
          production_count: productionCount

  # ---------------------------------------------------------------------
  # Text search over venues; resolver behind `productions.venue`.
  # ---------------------------------------------------------------------
  - name: venues
    description: Stadiums, arenas, and theaters. Text search over the venue index.
    base_url: https://catalog-search-service.corp.int.vividseats-staging.com
    auth:
      type: none

    search:
      method: GET
      path: /api/v1/venues
      query:
        query: "{query}"
        page: "{page}"
        pageSize: "{page_size}"
        sortBy: "{sort}"
      first_page: 1
      filters:
        excludeParking:
          param: excludeParking
          type: boolean
          description: Drop parking lots, which are modeled as venues upstream.
      sorts:
        - name: relevance
          value: NONE
          description: Best text match. The default.
        - name: rank
          value: RANK
          description: Popularity first.
      response:
        items_path: items
        total_path: total
        fields:
          id: id
          title: name
          url: organicUrl
        attributes:
          city: city
          state: state
          capacity: capacity
